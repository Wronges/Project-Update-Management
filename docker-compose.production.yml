services:
  project-update-management:
    build: .
    image: project-update-management:local
    container_name: project-update-management
    restart: unless-stopped
    network_mode: host
    environment:
      PUM_HOST: 127.0.0.1
      PUM_PORT: 8787
      PUM_INVENTORY: /app/config/projects.json
      PUM_DATABASE: /app/data/project-update.db
      PUM_WEB_ROOT: /app/apps/web/dist
      PUM_ADMIN_TOKEN: ${PUM_ADMIN_TOKEN:?PUM_ADMIN_TOKEN is required}
      PUM_TIME_ZONE: ${PUM_TIME_ZONE:-Asia/Shanghai}
      PUM_ROLLBACK_ON_FAILURE: ${PUM_ROLLBACK_ON_FAILURE:-true}
      PUM_CHECK_INTERVAL_MINUTES: ${PUM_CHECK_INTERVAL_MINUTES:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt:/opt:ro
      - ./data:/app/data
      - ./config/projects.json:/app/config/projects.json:ro
